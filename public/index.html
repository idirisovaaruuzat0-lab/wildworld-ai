<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b36">
  <meta name="description" content="WILDWORLD AI — intelligent everyday planner.">
  <title>WILDWORLD AI — AI for Life</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-theme="jungle">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" data-view="dashboard"><span class="brand-mark">W</span><span>WILDWORLD<small>AI FOR LIFE</small></span></a>
      <div class="world-switch" aria-label="World theme">
        <button class="world-option active" data-theme-choice="jungle"><span>✿</span><b>Jungle</b></button>
        <button class="world-option" data-theme-choice="arctic"><span>❄</span><b>Arctic</b></button>
      </div>
      <div class="side-label" data-i18n="workspace">WORKSPACE</div>
      <nav class="navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span><span data-i18n="dashboard">Главная</span></button>
        <button class="nav-item" data-view="tasks"><span class="nav-icon">▤</span><span data-i18n="tasks">Мои задачи</span><span class="nav-count" id="navTaskCount">0</span></button>
        <button class="nav-item" data-view="planner"><span class="nav-icon">✳</span><span data-i18n="planner">AI-планировщик</span></button>
        <button class="nav-item" data-view="calendar"><span class="nav-icon">▦</span><span data-i18n="calendar">Календарь</span></button>
        <button class="nav-item" data-view="history"><span class="nav-icon">◷</span><span data-i18n="history">История AI</span></button>
        <button class="nav-item" data-view="statistics"><span class="nav-icon">▥</span><span data-i18n="statistics">Статистика</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="nature-note"><span class="note-icon" id="noteIcon">🌿</span><p data-i18n="sideQuote">Маленькие шаги создают большие перемены.</p></div>
        <button class="nav-item" data-view="about"><span class="nav-icon">ⓘ</span><span data-i18n="about">О проекте</span></button>
        <button class="nav-item" data-view="testing"><span class="nav-icon">✓</span><span data-i18n="testing">Тестирование</span></button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark">W</span> WILDWORLD AI</div>
        <div class="breadcrumb"><span data-i18n="workspace">WORKSPACE</span><span>/</span><b id="currentSection">Главная</b></div>
        <div class="top-actions">
          <div class="language-switch"><button class="lang active" data-lang="ru">RU</button><span></span><button class="lang" data-lang="en">EN</button></div>
         <div class="mobile-world-switch">
  <button class="world-option" data-theme-choice="jungle" title="Jungle">🌿</button>
  <button class="world-option" data-theme-choice="arctic" title="Arctic">❄️</button>
</div>
 <div class="api-indicator" id="apiIndicator"><i></i><span data-i18n="checkingAI">Проверка AI…</span></div>
          <div class="avatar">WW</div>
        </div>
      </header>
      <div class="mobile-nav">
        <button data-view="dashboard">⌂</button><button data-view="tasks">▤</button><button data-view="planner">✳</button><button data-view="calendar">▦</button><button data-view="statistics">▥</button>
      </div>
      <div class="content" id="content"></div>
      <footer class="footer"><span>WILDWORLD AI <span class="footer-dot">•</span> AI FOR LIFE</span><span data-i18n="footer">Создано для более осознанного дня</span></footer>
    </main>
  </div>

  <dialog id="taskDialog" class="modal">
    <form id="taskForm" method="dialog">
      <div class="modal-head"><div><span class="eyebrow" data-i18n="taskDetails">TASK DETAILS</span><h2 id="taskDialogTitle" data-i18n="newTask">Новая задача</h2></div><button type="button" class="icon-button" id="closeTask">×</button></div>
      <input type="hidden" id="taskId">
      <label><span data-i18n="taskName">Название задачи</span><input id="taskTitle" required maxlength="100" placeholder="Например, подготовить презентацию"></label>
      <label><span data-i18n="description">Описание</span><textarea id="taskDescription" rows="2" placeholder="Дополнительные детали…"></textarea></label>
      <div class="form-grid">
        <label><span data-i18n="priority">Приоритет</span><select id="taskPriority"><option value="high" data-i18n="high">Высокий</option><option value="medium" selected data-i18n="medium">Средний</option><option value="low" data-i18n="low">Низкий</option></select></label>
        <label><span data-i18n="duration">Длительность (мин)</span><input id="taskDuration" type="number" min="5" max="600" value="30" required></label>
        <label><span data-i18n="deadline">Срок</span><input id="taskDate" type="date"></label>
      </div>
      <div class="modal-actions"><button type="button" class="button button-quiet" id="cancelTask" data-i18n="cancel">Отмена</button><button class="button button-primary" type="submit" data-i18n="saveTask">Сохранить задачу</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
